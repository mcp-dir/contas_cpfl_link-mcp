# Smithery configuration for CPFL: Download via link
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_contas_cpfl_link

name: contas_cpfl_link-mcp
displayName: "CPFL: Download via link"
description: >
  CPFL: Download via link, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/contas_cpfl_link-mcp
repository: https://github.com/mcp-dir/contas_cpfl_link-mcp

tags:
  - contas_cpfl_link
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_contas_cpfl_link

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_contas_cpfl_link/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
